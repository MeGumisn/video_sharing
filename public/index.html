<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Server Video Player</title>
    <!-- Include ArtPlayer Library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background-color: #121212; color: #ffffff; }
        .container { display: flex; flex-direction: column; max-width: 1200px; margin: 0 auto; padding: 15px; gap: 20px; }

        /* Player wrapper must have a fixed aspect ratio or height */
        .player-section { width: 100%; height: 50vh; max-height: 500px; background: #000; border-radius: 8px; overflow: hidden; }
        .artplayer-app { width: 100%; height: 100%; }

        .playlist-section { border: 1px solid #333; padding: 15px; border-radius: 8px; background: #1e1e1e; display: flex; flex-direction: column; }
        .playlist-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .playlist-header h3 { margin: 0; color: #00adb5; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70%; }

        /* Back button styling */
        .back-btn { background: #333; color: #fff; border: 1px solid #555; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; transition: background 0.2s; }
        .back-btn:hover { background: #444; }

        .video-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; flex: 1; }
        .video-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #2d2d2d; transition: background 0.2s; color: #ccc; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .video-item:hover { background: #2a2a2a; color: #fff; }
        .video-item.dir { color: #ffca28; font-weight: bold; } /* Folder specific color */
        .active-video { background: #00adb5 !important; color: white !important; font-weight: bold; border-radius: 4px; }

        /* Desktop Layout Optimization */
        @media (min-width: 768px) {
            .container { flex-direction: row; padding-top: 40px; }
            .player-section { flex: 2; height: 600px; max-height: 600px; }
            .playlist-section { flex: 1; max-height: 600px; height: 600px; box-sizing: border-box; }
            .video-list { max-height: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Left Side: Premium Player -->
    <div class="player-section">
        <div id="video-player-container" class="artplayer-app"></div>
    </div>
    <!-- Right Side: File List -->
    <div class="playlist-section">
        <div class="playlist-header">
            <h3 id="now-playing">Media Explorer</h3>
            <button id="backBtn" class="back-btn" onclick="goBack()" style="display:none;">⬅ Back</button>
        </div>
        <ul id="video-list" class="video-list">
            <li>Loading media library from server...</li>
        </ul>
    </div>
</div>
<script>
    const listContainer = document.getElementById("video-list");
    const titleHeader = document.getElementById("now-playing");
    const backBtn = document.getElementById("backBtn");

    let art = null; // Global player instance
    let currentPathStack = []; // Track folder navigation history
    let currentActiveUrl = ""; // Remember currently playing video url

    // 1. Initialize ArtPlayer with Premium Features
    function initPlayer(initialUrl = "") {
        art = new Artplayer({
            container: '#video-player-container',
            url: initialUrl,
            type: 'mp4',
            fullscreen: true,
            fullscreenWeb: true,
            playbackRate: true,
            aspectRatio: true,
            setting: true,
            pip: true,
            autoSize: false,
            autoMini: true,
            theme: '#00adb5',
            moreVideoAttr: {
                playsinline: true,
                'webkit-playsinline': true,
                'x5-video-player-type': 'h5-page',
            },
        });

        // 核心修改：只在移动端/触屏设备初始化手势，防止污染 PC 端的鼠标点击进度条事件
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            setupMobileGestures();
        }
    }

    // 2. Custom Left/Right Swiping on Screen to Control Video Progress
    function setupMobileGestures() {
        let touchStartX = 0;
        let touchStartY = 0;
        let baseTime = 0;
        const videoElement = art.template.$video;

        videoElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                baseTime = art.currentTime;
            }
        });

        videoElement.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - touchStartX;
                const deltaY = e.touches[0].clientY - touchStartY;

                // 当水平滑动明显大于垂直滑动时，才判定为调节进度
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 30) {
                    e.preventDefault();
                    const adjustSeconds = deltaX * 0.2;
                    let targetTime = baseTime + adjustSeconds;
                    if (targetTime < 0) targetTime = 0;
                    if (targetTime > art.duration) targetTime = art.duration;
                    art.currentTime = targetTime;
                    art.notice.show = `Seek: ${Math.round(targetTime)}s (${deltaX > 0 ? '▶▶' : '◀◀'})`;
                }
            }
        }, { passive: false });
    }

    // 3. Fetch file/directory list from Rust backend
    async function loadDirectory(relPath = "") {
        const url = relPath ? `/api/list?path=${encodeURIComponent(relPath)}` : '/api/list';
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Failed to fetch library structure");
            const items = await response.json();

            renderPlaylist(items);

            // Show or hide back button based on navigation depth
            backBtn.style.display = currentPathStack.length > 0 ? 'inline-block' : 'none';
        } catch (error) {
            listContainer.innerHTML = "<li>Error loading media list.</li>";
            console.error(error);
            if (!art) initPlayer(""); // Ensure player initializes even on error
        }
    }

    // 4. Render directory and video list item elements
    function renderPlaylist(items) {
        listContainer.innerHTML = "";

        if (items.length === 0) {
            listContainer.innerHTML = "<li style='padding:12px; color:#666;'>Empty directory</li>";
            return;
        }

        items.forEach((item) => {
            const li = document.createElement("li");
            li.className = `video-item ${item.is_dir ? 'dir' : 'video'}`;

            const icon = item.is_dir ? "📁" : "🎬";
            li.innerHTML = `<span>${icon}</span> <span>${item.name}</span>`;

            const targetVideoUrl = `/stream/${item.rel_path.split('/').map(encodeURIComponent).join('/')}`;

            if (!item.is_dir && currentActiveUrl === targetVideoUrl) {
                li.classList.add('active-video');
            }

            li.onclick = () => {
                if (item.is_dir) {
                    currentPathStack.push(item.rel_path);
                    loadDirectory(item.rel_path);
                } else {
                    playVideo(item.name, targetVideoUrl, li);
                }
            };
            listContainer.appendChild(li);
        });

        if (!art) {
            initPlayer("");
        }
    }

    // 5. Back to Parent Directory handler
    function goBack() {
        currentPathStack.pop();
        const parentPath = currentPathStack[currentPathStack.length - 1] || "";
        loadDirectory(parentPath);
    }

    // 6. Play Selected Video via Stream Endpoint
    function playVideo(filename, videoUrl, element) {
        titleHeader.textContent = `Playing: ${filename}`;
        currentActiveUrl = videoUrl;

        // Switch video stream source seamlessly inside ArtPlayer instance
        art.switchUrl(videoUrl).then(() => {
            art.play();
        }).catch(err => {
            console.error("Playback error:", err);
        });

        // Clear previous highlight markers and set active class
        document.querySelectorAll('.video-item').forEach(item => item.classList.remove('active-video'));
        element.classList.add('active-video');
    }

    // Start initialization process on document startup
    loadDirectory();
</script>
</body>
</html>
