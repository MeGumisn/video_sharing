[package]
name = "video_sharing"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
strip = true
opt-level = 3
panic = "abort"
codegen-units = 1
debug = "none"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.0.3", features = ["full"] }
tower-http = { version = "0.6.10", features = ["fs", "cors"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
